<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin · AnimalPad</title>
<meta name="robots" content="noindex">
<script>try { if (localStorage.getItem("animalpad-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500..800&family=Outfit:wght@400..700&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.back { color: var(--text); font-weight: 600; text-underline-offset: 4px; }
.coinpage { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 720px) { .coinpage { grid-template-columns: minmax(0, 1fr); } }
.coinpage .pic { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--line); border-radius: 18px; background: var(--soft); display: block; }
.coinpage .pic.noimg { display: grid; place-items: center; font: 700 4rem/1 var(--display); color: var(--muted); }
.cp-body { display: grid; gap: 14px; min-width: 0; }
.cp-body h1 { max-width: none; font-size: clamp(1.8rem, 5vw, 2.8rem); }
.cp-body .sym { color: var(--muted); font-weight: 700; font-size: 1.1rem; }
.cp-desc { margin: 0; max-width: 60ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts a, .cp-links a { color: var(--text); text-underline-offset: 3px; }
.cp-links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.mood { display: inline-block; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); font: 600 13px var(--font); width: fit-content; }
.mood[data-mood="awake"] { background: var(--paper); }
.mood[data-mood="excited"], .mood[data-mood="ready"] { background: var(--accent); color: var(--on-accent); }
.mood[data-mood="graduated"] { background: var(--pop); color: #1c1547; }
.pic[data-mood="sleepy"] { filter: saturate(0.6) brightness(0.9); }
.pic[data-mood="excited"], .pic[data-mood="ready"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.pic[data-mood="graduated"] { border-color: var(--pop); box-shadow: 0 0 0 3px var(--pop); }
.chat { display: grid; gap: 10px; margin-top: 22px; }
.chat h2 { margin: 0; font: 700 1.2rem/1.2 var(--display); }
.chat-log { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
.chat-log p { margin: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; max-width: 80%; overflow-wrap: anywhere; }
.chat-log .me { justify-self: end; background: var(--accent); color: var(--on-accent); }
.chat-log .bot { justify-self: start; background: var(--soft); }
.chat-row { display: flex; gap: 8px; }
.chat-row input { flex: 1 1 auto; min-width: 0; background: var(--soft); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font: inherit; }
.cp-actions { display: flex; flex-wrap: wrap; gap: 10px; }
a.btn { text-decoration: none; display: inline-block; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="/" style="color:inherit;text-decoration:none">AnimalPad</a>
    <div class="row">
      <span class="chip-net">Devnet test · no real money</span>
      <button type="button" class="mode" id="theme" aria-label="Switch to light mode" title="Switch light or dark"></button>
    </div>
  </header>
  <a class="back" href="/#recent">Back to recent launches</a>

  <section class="panel" id="cp" aria-live="polite">
    <p class="hint" id="cp-note">Loading this coin…</p>
  </section>

  <p class="foot">Test version on Solana devnet. Pictures are made by AI. Tokens here have no value.</p>
</main>
<script src="/coin.js"></script>
</body>
</html>
